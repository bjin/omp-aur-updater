name: Update oh-my-pi-bin AUR package

on:
  workflow_dispatch:
  schedule:
    - cron: "12,32,52 * * * *"

permissions:
  contents: read

concurrency:
  group: update-aur-oh-my-pi-bin
  cancel-in-progress: false

jobs:
  prepare:
    name: Update package metadata
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      message: ${{ steps.update.outputs.message }}
    steps:
      - name: Install SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Clone AUR package
        run: |
          set -euo pipefail
          clone_root=$(mktemp -d)
          clone_destination="$clone_root/aur"
          trap 'rm -rf "$clone_root"' EXIT
          max_clone_attempts=4
          clone_attempt=1
          while ! git clone ssh://aur@aur.archlinux.org/oh-my-pi-bin.git "$clone_destination"; do
            if [ "$clone_attempt" -ge "$max_clone_attempts" ]; then
              echo "git clone failed after ${clone_attempt} attempts." >&2
              exit 1
            fi
            rm -rf "$clone_destination"
            backoff_seconds=$((2 ** (clone_attempt - 1)))
            echo "git clone failed; retrying in ${backoff_seconds}s (attempt $((clone_attempt + 1))/${max_clone_attempts})." >&2
            sleep "$backoff_seconds"
            clone_attempt=$((clone_attempt + 1))
          done
          mv "$clone_destination" aur
          rmdir "$clone_root"
          trap - EXIT

      - name: Update PKGBUILD and .SRCINFO
        id: update
        working-directory: aur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT

          gh api repos/can1357/oh-my-pi/releases/latest > "$work_dir/release.json"
          latest_tag=$(jq -r .tag_name "$work_dir/release.json")
          if [[ "$latest_tag" != v* ]]; then
            echo "Unexpected tag_name: $latest_tag" >&2
            exit 1
          fi
          # Fetched on every run: upstream may move a published tag, and the
          # LICENSE source follows the tag.
          if ! curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 \
              "https://raw.githubusercontent.com/can1357/oh-my-pi/${latest_tag}/LICENSE" \
              -o "$work_dir/LICENSE"; then
            echo "Unable to download LICENSE for ${latest_tag}." >&2
            exit 1
          fi

          python3 - "$work_dir/release.json" "$work_dir/LICENSE" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          BINARY_ASSETS = {
              "sha256sums_x86_64": "omp-linux-x64",
              "sha256sums_aarch64": "omp-linux-arm64",
          }

          def version_tuple(value):
              return tuple(int(part) for part in value.split("."))

          def asset_sha256(assets, asset_name):
              for asset in assets:
                  if asset.get("name") != asset_name:
                      continue
                  digest = asset.get("digest") or ""
                  if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                      raise SystemExit(f"Asset {asset_name} has no sha256 digest: {digest!r}")
                  return digest.removeprefix("sha256:")
              raise SystemExit(f"Asset {asset_name} not found")

          def read_assignment(content, name, value_pattern):
              match = re.search(
                  rf"^{re.escape(name)}={value_pattern}$", content, flags=re.MULTILINE
              )
              if not match:
                  raise SystemExit(f"Could not find {name} in PKGBUILD")
              return match.group(1)

          def read_sha256sum(content, name):
              return read_assignment(content, name, r"\('([0-9a-f]{64})'\)")

          def replace_assignment(content, name, value):
              content, replaced = re.subn(
                  rf"^{re.escape(name)}=.*$",
                  lambda _: f"{name}={value}",
                  content,
                  count=1,
                  flags=re.MULTILINE,
              )
              if replaced != 1:
                  raise SystemExit(f"Could not find {name} in PKGBUILD")
              return content

          def write_outputs(**values):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for key, value in values.items():
                      output.write(f"{key}={value}\n")

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          latest = release["tag_name"][1:]
          assets = release.get("assets", [])
          checksums = {"sha256sums": hashlib.sha256(Path(sys.argv[2]).read_bytes()).hexdigest()}
          for name, asset_name in BINARY_ASSETS.items():
              checksums[name] = asset_sha256(assets, asset_name)

          content = Path("PKGBUILD").read_text(encoding="utf-8")
          current = read_assignment(content, "pkgver", r"(\S+)")
          current_pkgrel = read_assignment(content, "pkgrel", r"(\S+)")

          if version_tuple(latest) < version_tuple(current):
              write_outputs(changed="false")
              print(f"PKGBUILD {current} is newer than latest release {latest}")
              sys.exit(0)

          if version_tuple(latest) == version_tuple(current):
              pinned = {name: read_sha256sum(content, name) for name in checksums}
              stale = [name for name, checksum in checksums.items() if pinned[name] != checksum]
              if not stale:
                  write_outputs(changed="false")
                  print(f"already up to date: {current}-{current_pkgrel}")
                  sys.exit(0)
              # Upstream replaced files of a published release (e.g. moved the
              # tag and re-uploaded assets); a new pkgrel makes existing
              # installs pick up the replacements.
              for name in stale:
                  print(f"{name}: {pinned[name]} -> {checksums[name]}")
              pkgrel = str(int(current_pkgrel.split(".")[0]) + 1)
              message = f"update checksums for re-uploaded {latest} assets"
          else:
              pkgrel = "1"
              message = f"upstream release: {latest}"

          content = replace_assignment(content, "pkgver", latest)
          content = replace_assignment(content, "pkgrel", pkgrel)
          for name, checksum in checksums.items():
              content = replace_assignment(content, name, f"('{checksum}')")
          Path("PKGBUILD").write_text(content, encoding="utf-8")

          write_outputs(changed="true", message=message)
          print(f"updated: {current}-{current_pkgrel} -> {latest}-{pkgrel}")
          PY

          changed=$(awk -F= '$1 == "changed" { value = $2 } END { print value }' "$GITHUB_OUTPUT")
          if [ "$changed" = "true" ]; then
            docker run --rm -v "$PWD:/pkg" archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed pacman-contrib
              useradd -m builder
              chown -R builder:builder /pkg
              cd /pkg
              su builder -c "makepkg --printsrcinfo > .SRCINFO"
            '
          fi

      - name: Upload updated package metadata
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aur-metadata
          path: |
            aur/PKGBUILD
            aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and smoke test in Arch
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download package metadata
        uses: actions/download-artifact@v4
        with:
          name: aur-metadata
          path: aur

      - name: Build package in fresh Arch container
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/aur:/pkg" archlinux:base-devel bash -lc '
            set -euo pipefail
            pacman -Syu --noconfirm
            useradd -m builder
            # makepkg -s installs the PKGBUILD depends/makedepends through
            # "sudo -k pacman", which must not prompt for a password.
            echo "builder ALL=(root) NOPASSWD: /usr/bin/pacman" > /etc/sudoers.d/makepkg-syncdeps
            chmod 440 /etc/sudoers.d/makepkg-syncdeps
            visudo -cqf /etc/sudoers.d/makepkg-syncdeps
            chown -R builder:builder /pkg
            cd /pkg
            su builder -c "makepkg -Csf --noconfirm"
          '

      - name: Smoke test built package in fresh Arch container
        run: |
          set -euo pipefail
          package_path=$(python3 - <<'PY'
          from pathlib import Path
          packages = sorted(Path("aur").glob("*.pkg.tar.zst"), key=lambda path: path.stat().st_mtime)
          if not packages:
              raise SystemExit("No built package found")
          print(packages[-1])
          PY
          )
          docker run --rm -v "$PWD:/work:ro" archlinux:base-devel bash -lc '
            set -euo pipefail
            pacman -Syu --noconfirm
            pacman -U --noconfirm "/work/'"$package_path"'"
            runtime=$(mktemp -d)
            export HOME="$runtime/home"
            export XDG_DATA_HOME="$runtime/xdg"
            mkdir -p "$HOME" "$XDG_DATA_HOME"
            omp --version
            omp --help >/dev/null
            omp completions bash >/dev/null
            omp completions zsh >/dev/null
            omp completions fish >/dev/null
          '

  publish:
    name: Commit and push to AUR
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Clone AUR package
        run: |
          set -euo pipefail
          clone_root=$(mktemp -d)
          clone_destination="$clone_root/aur"
          trap 'rm -rf "$clone_root"' EXIT
          max_clone_attempts=4
          clone_attempt=1
          while ! git clone ssh://aur@aur.archlinux.org/oh-my-pi-bin.git "$clone_destination"; do
            if [ "$clone_attempt" -ge "$max_clone_attempts" ]; then
              echo "git clone failed after ${clone_attempt} attempts." >&2
              exit 1
            fi
            rm -rf "$clone_destination"
            backoff_seconds=$((2 ** (clone_attempt - 1)))
            echo "git clone failed; retrying in ${backoff_seconds}s (attempt $((clone_attempt + 1))/${max_clone_attempts})." >&2
            sleep "$backoff_seconds"
            clone_attempt=$((clone_attempt + 1))
          done
          mv "$clone_destination" aur
          rmdir "$clone_root"
          trap - EXIT

      - name: Download package metadata
        uses: actions/download-artifact@v4
        with:
          name: aur-metadata
          path: updated

      - name: Commit and push
        env:
          COMMIT_MESSAGE: ${{ needs.prepare.outputs.message }}
        run: |
          set -euo pipefail
          cp updated/PKGBUILD updated/.SRCINFO aur/
          cd aur
          if git diff --quiet -- PKGBUILD .SRCINFO; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name 'Bin Jin'
          git config user.email 'bjin@protonmail.com'
          git add PKGBUILD .SRCINFO
          git commit -m "$COMMIT_MESSAGE"
          max_push_attempts=4
          push_attempt=1
          while ! git push origin master; do
            if [ "$push_attempt" -ge "$max_push_attempts" ]; then
              echo "git push failed after ${push_attempt} attempts." >&2
              exit 1
            fi
            backoff_seconds=$((2 ** (push_attempt - 1)))
            echo "git push failed; retrying in ${backoff_seconds}s (attempt $((push_attempt + 1))/${max_push_attempts})." >&2
            sleep "$backoff_seconds"
            push_attempt=$((push_attempt + 1))
          done
