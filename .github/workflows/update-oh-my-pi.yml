name: Update oh-my-pi AUR package and pacman repo

on:
  workflow_dispatch:
  schedule:
    - cron: "18,38,58 * * * *"

permissions:
  contents: write

concurrency:
  group: update-aur-oh-my-pi
  cancel-in-progress: false

jobs:
  update:
    name: Build, test, and publish oh-my-pi
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not configured." >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: Clone AUR package
        run: |
          set -euo pipefail
          clone_root=$(mktemp -d)
          clone_destination="$clone_root/aur"
          trap 'rm -rf "$clone_root"' EXIT
          max_clone_attempts=4
          clone_attempt=1
          while ! git clone ssh://aur@aur.archlinux.org/oh-my-pi.git "$clone_destination"; do
            if [ "$clone_attempt" -ge "$max_clone_attempts" ]; then
              echo "git clone failed after ${clone_attempt} attempts." >&2
              exit 1
            fi
            rm -rf "$clone_destination"
            backoff_seconds=$((2 ** (clone_attempt - 1)))
            echo "git clone failed; retrying in ${backoff_seconds}s (attempt $((clone_attempt + 1))/${max_clone_attempts})." >&2
            sleep "$backoff_seconds"
            clone_attempt=$((clone_attempt + 1))
          done
          mv "$clone_destination" aur
          rmdir "$clone_root"
          trap - EXIT

      - name: Plan package update and release
        id: update
        working-directory: aur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_version=$(awk -F= '/^pkgver=/{ print $2; exit }' PKGBUILD)
          current_version="${current_version//[[:space:]]/}"
          if [ -z "$current_version" ]; then
            echo "Unable to read pkgver from PKGBUILD." >&2
            exit 1
          fi
          if [[ "$current_version" != *.*.* ]]; then
            echo "Invalid pkgver in PKGBUILD: $current_version" >&2
            exit 1
          fi

          current_pkgrel=$(awk -F= '/^pkgrel=/{ print $2; exit }' PKGBUILD)
          current_pkgrel="${current_pkgrel//[[:space:]]/}"
          if [ -z "$current_pkgrel" ]; then
            echo "Unable to read pkgrel from PKGBUILD." >&2
            exit 1
          fi

          package_asset="oh-my-pi-${current_version}-${current_pkgrel}-x86_64.pkg.tar.zst"
          release_response=$(mktemp)
          release_error=$(mktemp)
          trap 'rm -f "$release_response" "$release_error"' EXIT
          if gh api --include \
              "repos/${GITHUB_REPOSITORY}/releases/tags/oh-my-pi" \
              > "$release_response" 2> "$release_error"; then
            package_published=$(
              python3 - "$release_response" "$package_asset" <<'PY'
          import json
          import sys
          from pathlib import Path

          response = Path(sys.argv[1]).read_bytes()
          for separator in (b"\r\n\r\n", b"\n\n"):
              if separator in response:
                  _, body = response.split(separator, 1)
                  break
          else:
              raise SystemExit("GitHub release response is missing a body")

          release = json.loads(body)
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("GitHub release response is missing an assets list")

          asset_name = sys.argv[2]
          print(
              "true"
              if any(asset.get("name") == asset_name for asset in assets)
              else "false"
          )
          PY
            )
          elif grep -Eq '^HTTP/[0-9.]+ 404 ' "$release_response"; then
            package_published=false
          else
            cat "$release_error" >&2
            cat "$release_response" >&2
            echo "Unable to query GitHub release oh-my-pi." >&2
            exit 1
          fi

          if [ "$package_published" = false ]; then
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "Building current package: $package_asset is not published."
            exit 0
          fi
          if [ "$package_published" != true ]; then
            echo "Unexpected publication status: $package_published" >&2
            exit 1
          fi

          latest_ref=$(
            git ls-remote --refs --tags --sort=-v:refname \
              https://github.com/can1357/oh-my-pi.git 'v*.*.*' |
              awk 'NR == 1 { print $2 }'
          )
          if [ -z "$latest_ref" ]; then
            echo "Unable to find the latest upstream version tag." >&2
            exit 1
          fi

          latest_version="${latest_ref##*/v}"
          if [[ "$latest_version" != *.*.* ]]; then
            echo "Invalid upstream version: $latest_version" >&2
            exit 1
          fi

          current_is_current_or_newer=$(
            python3 - "$current_version" "$latest_version" <<'PY'
          import sys

          current = tuple(int(part) for part in sys.argv[1].split("."))
          latest = tuple(int(part) for part in sys.argv[2].split("."))
          print("true" if current >= latest else "false")
          PY
          )
          if [ "$current_is_current_or_newer" = true ]; then
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "No update needed: current package $current_version-$current_pkgrel is published."
            exit 0
          fi

          lockfile=$(mktemp)
          pkgbuild_tmp=$(mktemp)
          trap 'rm -f "$lockfile" "$pkgbuild_tmp"' EXIT

          # PKGBUILD pins the `opus` crate so prepare() can patch a copy of it
          # into linking the system libopus, and pins the checksum Cargo.lock
          # records for that crate. Both have to follow the upstream lockfile.
          if ! curl -fsSL --retry 4 --retry-all-errors --retry-delay 2 \
              "https://raw.githubusercontent.com/can1357/oh-my-pi/v${latest_version}/Cargo.lock" \
              -o "$lockfile"; then
            echo "Unable to download Cargo.lock for v${latest_version}." >&2
            exit 1
          fi

          opus_metadata=$(
            python3 - "$lockfile" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          packages = [
              package
              for package in lock.get("package", [])
              if package.get("name") == "opus"
          ]
          if len(packages) != 1:
              raise SystemExit(
                  f"Expected one opus package in Cargo.lock, found {len(packages)}"
              )

          version = packages[0].get("version")
          checksum = packages[0].get("checksum")
          if not version or not checksum:
              raise SystemExit("Cargo.lock opus entry has no version or checksum")
          print(version, checksum)
          PY
          )
          read -r opus_version opus_checksum <<<"$opus_metadata"
          if [[ ! "$opus_version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "Invalid opus version in Cargo.lock: $opus_version" >&2
            exit 1
          fi
          if [[ ! "$opus_checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid opus checksum in Cargo.lock: $opus_checksum" >&2
            exit 1
          fi

          # The crate's sha256sums entry is positional, so read the current pin
          # back through the PKGBUILD's own arrays instead of guessing an index.
          opus_pin=$(
            set -euo pipefail
            # shellcheck source=/dev/null
            . ./PKGBUILD
            for index in "${!source[@]}"; do
              if [[ "${source[index]}" == */opus-"${_opus_ver}".crate ]]; then
                printf '%s %s\n' "$_opus_ver" "${sha256sums[index]}"
                exit 0
              fi
            done
            echo "Unable to locate the opus crate in the PKGBUILD source array." >&2
            exit 1
          )
          read -r current_opus_version current_opus_checksum <<<"$opus_pin"
          if [[ ! "$current_opus_checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid opus checksum in PKGBUILD: $current_opus_checksum" >&2
            exit 1
          fi

          if ! awk -v latest_version="$latest_version" \
            -v current_opus_version="$current_opus_version" \
            -v opus_version="$opus_version" \
            -v current_opus_checksum="$current_opus_checksum" \
            -v opus_checksum="$opus_checksum" '
            BEGIN {
              updated_pkgver = 0
              updated_pkgrel = 0
              updated_opus_ver = 0
              updated_opus_checksum = 0
            }
            /^pkgver=/ && !updated_pkgver {
              print "pkgver=" latest_version
              updated_pkgver = 1
              next
            }
            /^pkgrel=/ && !updated_pkgrel {
              print "pkgrel=1"
              updated_pkgrel = 1
              next
            }
            $0 == "_opus_ver=" current_opus_version && !updated_opus_ver {
              print "_opus_ver=" opus_version
              updated_opus_ver = 1
              next
            }
            !updated_opus_checksum {
              position = index($0, current_opus_checksum)
              if (position > 0) {
                print substr($0, 1, position - 1) opus_checksum \
                  substr($0, position + length(current_opus_checksum))
                updated_opus_checksum = 1
                next
              }
            }
            {
              print
            }
            END {
              exit((updated_pkgver && updated_pkgrel && updated_opus_ver && updated_opus_checksum) ? 0 : 1)
            }
          ' PKGBUILD > "$pkgbuild_tmp"; then
            echo "Unable to update pkgver, pkgrel, and the opus pin in PKGBUILD." >&2
            exit 1
          fi
          mv "$pkgbuild_tmp" PKGBUILD

          echo "version=$latest_version" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "Updated: $current_version -> $latest_version"
          if [ "$current_opus_version" != "$opus_version" ] ||
             [ "$current_opus_checksum" != "$opus_checksum" ]; then
            echo "Updated opus pin: $current_opus_version -> $opus_version"
          fi

      - name: Build and smoke test package
        if: steps.update.outputs.build == 'true'
        working-directory: aur
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/pkg" archlinux:base-devel bash -lc '
            set -euo pipefail
            pacman -Syu --needed --noconfirm rust

            host_uid=$(stat -c %u /pkg)
            host_gid=$(stat -c %g /pkg)

            if ! getent group "$host_gid" >/dev/null; then
              groupadd -g "$host_gid" builder
            fi

            if getent passwd "$host_uid" >/dev/null; then
              builder=$(getent passwd "$host_uid" | cut -d: -f1)
            else
              useradd -m -u "$host_uid" -g "$host_gid" builder
              builder=builder
            fi

            builder_home=$(getent passwd "$builder" | cut -d: -f6)
            install -d -o "$host_uid" -g "$host_gid" "$builder_home"

            # makepkg --syncdeps installs the PKGBUILD depends/makedepends
            # through "sudo -k pacman", which must not prompt for a password.
            printf "%s ALL=(root) NOPASSWD: /usr/bin/pacman\n" "$builder" \
              > /etc/sudoers.d/makepkg-syncdeps
            chmod 440 /etc/sudoers.d/makepkg-syncdeps
            visudo -cqf /etc/sudoers.d/makepkg-syncdeps

            su "$builder" -s /usr/bin/bash <<'"'"'EOSU'"'"'
            set -euo pipefail
            cd /pkg
            makepkg --syncdeps --noconfirm
            makepkg --printsrcinfo >.SRCINFO

            runtime_dir=$(mktemp -d)
            trap '"'"'rm -rf "$runtime_dir"'"'"' EXIT
            smoke_output=$(
              env HOME="${runtime_dir}/home" XDG_DATA_HOME="${runtime_dir}/xdg" \
                pkg/oh-my-pi/usr/bin/omp --smoke-test
            )
            if [ "$smoke_output" != "smoke-test: ok" ]; then
              echo "Unexpected omp --smoke-test output: $smoke_output" >&2
              exit 1
            fi
          EOSU
          '

      - name: Record built package
        if: steps.update.outputs.build == 'true'
        id: package
        working-directory: aur
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=( *.pkg.tar.* )
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected one built package, found ${#packages[@]}." >&2
            printf '  %s\n' "${packages[@]}" >&2
            exit 1
          fi
          echo "filename=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push to AUR
        if: steps.update.outputs.bump == 'true'
        working-directory: aur
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "Bin Jin"
          git config user.email "bjin@protonmail.com"
          git config commit.gpgsign false
          git add PKGBUILD .SRCINFO
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No package metadata changes to commit." >&2
            exit 1
          fi
          git --no-pager diff --cached
          git commit -m "upstream release: ${VERSION}"
          max_push_attempts=4
          push_attempt=1
          while ! git push origin master; do
            if [ "$push_attempt" -ge "$max_push_attempts" ]; then
              echo "git push failed after ${push_attempt} attempts." >&2
              exit 1
            fi
            backoff_seconds=$((2 ** (push_attempt - 1)))
            echo "git push failed; retrying in ${backoff_seconds}s (attempt $((push_attempt + 1))/${max_push_attempts})." >&2
            sleep "$backoff_seconds"
            push_attempt=$((push_attempt + 1))
          done

      - name: Publish signed pacman repository
        if: steps.update.outputs.build == 'true'
        env:
          ARCH_REPO_GPG_PRIVATE_KEY: ${{ secrets.ARCH_REPO_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e ARCH_REPO_GPG_PRIVATE_KEY \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e PACKAGE_FILENAME \
            -v "$PWD:/work" \
            -w /work \
            archlinux:base-devel bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed gnupg python
              python3 scripts/publish_arch_repo.py \
                --release oh-my-pi \
                --repo-name oh-my-pi \
                --key-fingerprint F35777CFE7F0794D92338EA52FABE6F52B586BAB \
                --keep-newest 5 \
                --minimum-age-days 7 \
                "aur/${PACKAGE_FILENAME}"
            '

